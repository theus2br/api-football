<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 250px;
            background: #343a40;
            color: white;
            padding: 15px;
            height: 100vh;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            cursor: pointer;
        }
        .sidebar a:hover {
            background: #495057;
            border-radius: 5px;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .navbar {
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h4>Dashboard</h4>
        <a href="#" onclick="showSection('home')"><i class="bi bi-house"></i> Home</a>
        <a href="#" onclick="showSection('reports')"><i class="bi bi-bar-chart"></i> Relatórios</a>
        <a href="#"><i class="bi bi-gear"></i> Configurações</a>
        <a href="#"><i class="bi bi-box-arrow-right"></i> Sair</a>
    </div>
    
    <!-- Conteúdo Principal -->
    <div class="content">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light shadow-sm px-3">
            <span class="navbar-brand">API Football</span>
        </nav>
        
        <!-- Seção Relatórios -->
        <div id="home" class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2>Relatórios</h2>
                <button class="btn btn-success" onclick="exportToCSV()">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Exportar CSV
                </button>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <div class="card text-bg-primary mb-3 p-3">
                        <h5>Total de Usuários</h5>
                        <p class="display-6">1,250</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-bg-success mb-3 p-3">
                        <h5>Vendas Mensais</h5>
                        <p class="display-6">R$ 32,400</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-bg-warning mb-3 p-3">
                        <h5>Tickets Abertos</h5>
                        <p class="display-6">18</p>
                    </div>
                </div>
            </div>
        </div>
        <canvas id="myChart"></canvas>
    </div>
    
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'],
                datasets: [{
                    label: 'Vendas',
                    data: [500, 700, 800, 1200, 1500, 1800],
                    backgroundColor: 'rgba(54, 162, 235, 0.6)'
                }]
            }
        });
    </script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       
        function exportToCSV() {
            console.log("Exportando dados para CSV...");
            
            $.get('/head-to-head', { id1: '121', id2: '131' }, function(data) {
                console.log(data);
            }).done(function(){
                alert("Arquivo exportado com sucesso!");
            });
        }
    </script>
</body>
</html>
